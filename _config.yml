title: "Swallow8801"
description: "AI Full Stack Developer — LLM · RAG · Vector Search · Web · Infra"
url: "https://swallow8801.github.io"
baseurl: ""

author:
  name: "Swallow8801"
  email: "swallow8801@gmail.com"
  github: "swallow8801"
  linkedin: "swallow8801"

# Analytics — GA4 측정 ID(G-XXXXXXXXXX) 입력 시 프로덕션 빌드에서만 추적 로드
google_analytics: "G-65N9HGZF19"

# Comments — giscus (GitHub Discussions). repo_id·category_id 입력 시 댓글 활성
comments:
  giscus:
    repo: "swallow8801/Swallow8801.github.io"
    repo_id: "R_kgDOSt4CNA"
    category: "Announcements"
    category_id: "DIC_kwDOSt4CNM4C_zJe"

# Build
markdown: kramdown
highlighter: rouge
permalink: /blog/:slug/
future: true   # 한국시간 기준 "오늘" 작성한 글이 UTC 빌드 서버에서 미래 날짜로 제외되는 것 방지

kramdown:
  input: GFM
  syntax_highlighter: rouge

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Feed
feed:
  path: feed.xml

# Exclude from build
exclude:
  - landing.html
  - blog.html
  - Gemfile
  - Gemfile.lock
  - README.md
  - "*.sh"
  - node_modules
  - vendor
  - post_candidate       # 후보 초안(layout:post) — 제외 안 하면 /post_candidate/* 로 발행됨
  - post-ideas.md        # 내부 글감 목록
  - CLAUDE_CODE_GUIDE.md # 내부 운영 가이드
  - UI_UX_PROMPTS.md     # 내부 프롬프트 모음
  - CATEGORY_LOGO_PROMPTS.md # 내부 헤더 이미지 프롬프트
  - BLOG_REVAMP_PROMPTS.md  # 내부 리뉴얼 프롬프트
  - PORTFOLIO_REDESIGN_PROMPT.md # 내부 리디자인 프롬프트
  - preview_mockups       # 방향 합의용 정적 목업 (빌드 제외)
