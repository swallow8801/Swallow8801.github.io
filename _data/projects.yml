# 포트폴리오 프로젝트 데이터
# type: ai | web | tool (필터 카테고리)
# featured: true 인 첫 번째 항목이 2열 Featured 카드로 표시
# repos: 카드 하단에 표시할 GitHub 링크 목록 (label + url)
# demo: 라이브 데모 URL ('#' 이면 버튼 숨김)
# detail: 상세 페이지 경로 ('#' 이면 상세 버튼 숨김)
# logo: 카드/히어로에 쓸 로고 이미지 (없으면 생략)
# accent / accent_rgb: 프로젝트별 액센트 색 (히어로·카드·링크에 --accent 로 주입)
#   - accent_rgb 는 반투명 틴트용 "r, g, b" 문자열. 없으면 기본 블루.
# preview: true → 실제 데이터가 아닌 플레이스홀더(카드에 PREVIEW 뱃지). 나중에 교체.

