<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1220" role="img" aria-label="Geofence 서비스 흐름도">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1000" height="1220" fill="#eef2f7"/>
  <text x="500" y="38" text-anchor="middle" fill="#0f1f3d" font-family="Arial, sans-serif" font-size="26" font-weight="700">Geofence 서비스 흐름도</text>

  <!-- A: CCTV 카메라 -->
  <rect x="300" y="60" width="400" height="90" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <rect x="324" y="84" width="56" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <circle cx="352" cy="104" r="11" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="500" y="100" text-anchor="middle" fill="#0f1f3d" font-family="Arial, sans-serif" font-size="21" font-weight="700">CCTV 카메라</text>
  <text x="500" y="128" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="15">RTSP 프레임 캡처</text>

  <!-- arrow A->B -->
  <line x1="500" y1="150" x2="500" y2="196" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="514" y="178" fill="#2563eb" font-family="Arial, sans-serif" font-size="14" font-weight="600">프레임 전달</text>

  <!-- B: AI 추론 서버 -->
  <rect x="220" y="200" width="560" height="120" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <rect x="248" y="222" width="58" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <line x1="258" y1="234" x2="296" y2="234" stroke="#2563eb" stroke-width="2"/>
  <line x1="258" y1="244" x2="296" y2="244" stroke="#2563eb" stroke-width="2"/>
  <line x1="258" y1="254" x2="296" y2="254" stroke="#2563eb" stroke-width="2"/>
  <text x="500" y="240" text-anchor="middle" fill="#0f1f3d" font-family="Arial, sans-serif" font-size="21" font-weight="700">AI 추론 서버 (YOLO Person Detection)</text>
  <text x="500" y="268" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="15">detections: [{ cls: "person", bbox: [x, y, w, h], track_id }]</text>
  <text x="500" y="292" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="15">frame_size: [W, H]</text>

  <!-- arrow B->C -->
  <line x1="500" y1="320" x2="500" y2="366" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="514" y="348" fill="#2563eb" font-family="Arial, sans-serif" font-size="14" font-weight="600">POST /api/ai/events</text>

  <!-- C: Backend aiEvents.controller -->
  <rect x="220" y="370" width="560" height="90" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="500" y="408" text-anchor="middle" fill="#0f1f3d" font-family="Arial, sans-serif" font-size="21" font-weight="700">Backend: aiEvents.controller</text>
  <text x="500" y="436" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="15">createFromAi / createFromAiWindow → saveRawEvent</text>

  <!-- arrow C->D -->
  <line x1="500" y1="460" x2="500" y2="506" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- E: zone config side input -->
  <rect x="20" y="560" width="160" height="120" rx="12" fill="#f0f9ff" stroke="#0891b2" stroke-width="3"/>
  <text x="100" y="592" text-anchor="middle" fill="#0f1f3d" font-family="Arial, sans-serif" font-size="16" font-weight="700">Zone 설정</text>
  <text x="100" y="616" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="13">cctv_geofence_zone</text>
  <text x="100" y="636" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="13">polygon (정규화 좌표)</text>
  <text x="100" y="656" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="13">max_count</text>
  <line x1="180" y1="620" x2="206" y2="620" stroke="#0891b2" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- D: Geofence 판정 엔진 (highlight) -->
  <rect x="190" y="510" width="620" height="220" rx="16" fill="#fffbeb" stroke="#f59e0b" stroke-width="4"/>
  <text x="500" y="546" text-anchor="middle" fill="#0f1f3d" font-family="Arial, sans-serif" font-size="22" font-weight="700">Geofence 판정 엔진 (geofence.service.js)</text>
  <text x="500" y="580" text-anchor="middle" fill="#7c5e10" font-family="Arial, sans-serif" font-size="15">① person bbox 하단 중심점 계산: (x + w/2, y + h)</text>
  <text x="500" y="608" text-anchor="middle" fill="#7c5e10" font-family="Arial, sans-serif" font-size="15">② 정규화 좌표 변환: (cx / W, cy / H)</text>
  <text x="500" y="636" text-anchor="middle" fill="#7c5e10" font-family="Arial, sans-serif" font-size="15">③ turf.booleanPointInPolygon(point, zone.polygon)</text>
  <text x="500" y="664" text-anchor="middle" fill="#7c5e10" font-family="Arial, sans-serif" font-size="15">④ Zone별 person track_id Set 갱신 → 직전 상태와 diff</text>
  <text x="500" y="700" text-anchor="middle" fill="#a16207" font-family="Arial, sans-serif" font-size="13">(매 AI 이벤트 배치마다 enabled 상태인 Zone 전체에 대해 반복)</text>

  <!-- arrow D->F -->
  <line x1="500" y1="730" x2="500" y2="776" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- F: Zone Occupancy 상태 -->
  <rect x="220" y="780" width="560" height="100" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="500" y="818" text-anchor="middle" fill="#0f1f3d" font-family="Arial, sans-serif" font-size="21" font-weight="700">Zone Occupancy 상태 갱신</text>
  <text x="500" y="846" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="15">Map&lt;zone_id, Set&lt;track_id&gt;&gt; — 변화가 있을 때만 다음 단계 진행</text>

  <!-- branch arrows from F -->
  <line x1="350" y1="880" x2="195" y2="936" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="500" y1="880" x2="500" y2="936" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="650" y1="880" x2="810" y2="930" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- G: Socket.IO emit -->
  <rect x="40" y="940" width="280" height="100" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="180" y="978" text-anchor="middle" fill="#0f1f3d" font-family="Arial, sans-serif" font-size="19" font-weight="700">Socket.IO emit</text>
  <text x="180" y="1004" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="15">'geofence:status'</text>

  <!-- K: DB log -->
  <rect x="360" y="940" width="280" height="100" rx="14" fill="#f0f9ff" stroke="#0891b2" stroke-width="3"/>
  <text x="500" y="978" text-anchor="middle" fill="#0f1f3d" font-family="Arial, sans-serif" font-size="19" font-weight="700">DB 로그 적재</text>
  <text x="500" y="1004" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="15">cctv_geofence_event</text>

  <!-- H: 초과 여부 diamond -->
  <polygon points="830,910 920,975 830,1040 740,975" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/>
  <text x="830" y="970" text-anchor="middle" fill="#0f1f3d" font-family="Arial, sans-serif" font-size="16" font-weight="700">최대 인원</text>
  <text x="830" y="990" text-anchor="middle" fill="#0f1f3d" font-family="Arial, sans-serif" font-size="16" font-weight="700">초과?</text>

  <!-- arrows row2 -->
  <line x1="180" y1="1040" x2="180" y2="1086" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="830" y1="1040" x2="830" y2="1086" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="846" y="1066" fill="#dc2626" font-family="Arial, sans-serif" font-size="14" font-weight="600">Yes</text>

  <!-- No branch from diamond back to K -->
  <path d="M745,975 C 660,975 660,1010 642,1010" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="660" y="965" fill="#64748b" font-family="Arial, sans-serif" font-size="13" font-weight="600">No</text>

  <!-- I: Frontend 실시간 갱신 -->
  <rect x="40" y="1090" width="280" height="110" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="180" y="1128" text-anchor="middle" fill="#0f1f3d" font-family="Arial, sans-serif" font-size="19" font-weight="700">Frontend 실시간 갱신</text>
  <text x="180" y="1154" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="14">카메라 오버레이 +</text>
  <text x="180" y="1176" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="14">Zone별 인원수 배지</text>

  <!-- J: Alarm -->
  <rect x="690" y="1090" width="280" height="110" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
  <text x="830" y="1128" text-anchor="middle" fill="#0f1f3d" font-family="Arial, sans-serif" font-size="19" font-weight="700">Alarm 생성</text>
  <text x="830" y="1154" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="14">adia_alarm INSERT +</text>
  <text x="830" y="1176" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="14">emit 'alarm:new'</text>
</svg>
