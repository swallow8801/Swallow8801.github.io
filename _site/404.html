  <script>
  (function () {
    var ov = document.getElementById('pg-overlay');
    /* 진입: 페이드 아웃 */
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { ov.classList.add('hidden'); });
    });
    /* 이탈: 링크 클릭 시 페이드 인 후 이동 */
    document.addEventListener('click', function (e) {
      var a = e.target.closest('a[href]');
      if (!a || !a.href || a.target === '_blank') return;
      var href = a.href;
      if (href === window.location.href || href.indexOf('#') !== -1) return;
      e.preventDefault();
      ov.style.transition = 'opacity .5s cubic-bezier(.4,0,.2,1)';
      ov.classList.remove('hidden');
      setTimeout(function () { window.location.href = href; }, 540);
    });
  })();
